name: NEIR public source-screen evidence
on:
  push:
    branches: ['test/neir-frontend-mock-*']
    paths:
      - 'scripts/neir-original-public-review.mjs'
      - '.github/workflows/source-public-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture public original states (read-only)
        run: node scripts/neir-original-public-review.mjs
      - name: Preserve reference screenshots and state inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neir-official-public-reference-screens
          path: reference-review/
          if-no-files-found: warn
          retention-days: 14
