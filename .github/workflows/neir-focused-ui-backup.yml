name: Temporary NEIR focused UI independent pre-release backup
on:
  push:
    branches: ['fix/neir-special-registration-focused-ux-20261031']
    paths: ['.github/workflows/neir-focused-ui-backup.yml']
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and restore original NEIR Git history
        run: |
          set -euo pipefail
          expected="d27b3234898911befdd16974bf5d0fd710185c4c"
          test "$(git rev-parse HEAD)" = "$expected"
          mkdir -p recovery
          git bundle create recovery/NEIR-Citizen-pre-focused-ui.bundle --all
          git bundle verify recovery/NEIR-Citizen-pre-focused-ui.bundle
          git clone -q recovery/NEIR-Citizen-pre-focused-ui.bundle /tmp/restore-neir
          test "$(git -C /tmp/restore-neir rev-parse HEAD)" = "$expected"
          git -C /tmp/restore-neir fsck --no-reflogs --no-progress
          sha256sum recovery/*.bundle > recovery/SHA256SUMS
          printf '%s\n' "pre_release_main=$expected" "restore_test=PASS" > recovery/RESTORE.txt
      - name: Save recoverable independent bundle
        uses: actions/upload-artifact@v4
        with:
          name: neir-focused-ui-pre-release-bundle
          path: recovery/
          if-no-files-found: error
          retention-days: 7
