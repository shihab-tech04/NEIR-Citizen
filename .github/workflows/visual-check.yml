name: NEIR desktop and mobile visual verification
on:
  push:
    branches: [main, 'fix/neir-parity-*']
    paths: ['.github/workflows/visual-check.yml', 'src/**', 'public/**', 'vercel.json', 'scripts/neir-responsive-design-audit.mjs']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/visual-check.yml', 'src/**', 'public/**', 'vercel.json', 'scripts/neir-responsive-design-audit.mjs']
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render homepage
        run: |
          npm run dev -- --host 127.0.0.1 --port 4567 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:4567 >/dev/null && break || sleep 1; done
          mkdir -p screenshots
          npx playwright screenshot --browser chromium --viewport-size="1780,925" --wait-for-timeout=1000 --full-page http://127.0.0.1:4567 screenshots/neir-restored-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1000 --full-page http://127.0.0.1:4567 screenshots/neir-restored-mobile.png
      - name: Compare source screen structure and mobile cards
        run: |
          node --input-type=module <<'EOT'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const mobile=await browser.newPage({viewport:{width:390,height:844}});
            await mobile.goto('http://127.0.0.1:4567/', {waitUntil:'networkidle'});
            // The new home service chooser moves the guide below the fold.
            // Explicitly bring lazy-loaded original guide assets into view before
            // measuring; still fail if any expected image is actually missing.
            const originalImages=mobile.locator('.neir-source-step-card img, .neir-source-hero-media img, .neir-logo-wrap img');
            for(const item of await originalImages.all()){
              await item.scrollIntoViewIfNeeded();
              await item.evaluate(async el => {
                await el.decode();
              });
            }
            await mobile.evaluate(()=>window.scrollTo(0,0));
            const metrics=await mobile.evaluate(()=>{
              const heights=[...document.querySelectorAll('.neir-source-step-card')].map(e=>Math.round(e.getBoundingClientRect().height));
              const badImages=[...document.querySelectorAll('.neir-source-step-card img, .neir-source-hero-media img, .neir-logo-wrap img')].filter(e=>!e.complete || e.naturalWidth===0).map(e=>e.getAttribute('src'));
              return {heights,badImages,overflow:document.documentElement.scrollWidth-window.innerWidth};
            });
            console.log('mobile source metrics',metrics);
            if(metrics.heights.length!==6 || metrics.heights.some(h=>h<160)) throw Error('Mobile original step cards missing/collapsed');
            if(metrics.badImages.length) throw Error('Required original images not loading: '+metrics.badImages.join(', '));
            if(metrics.overflow>3) throw Error('Mobile horizontal overflow '+metrics.overflow);
            const desktop=await browser.newPage({viewport:{width:1918,height:924}});
            await desktop.goto('http://127.0.0.1:4567/', {waitUntil:'networkidle'});
            const sourceParity=await desktop.evaluate(()=>{
              const steps=[...document.querySelectorAll('.neir-source-guide-heading')];
              const mainNav=[...document.querySelectorAll('.neir-main-navigation button')];
              const home=document.querySelector('.neir-source-hero-copy h1')?.getBoundingClientRect();
              const media=document.querySelector('.neir-source-hero-media')?.getBoundingClientRect();
              const firstCard=document.querySelector('.neir-source-step-card')?.getBoundingClientRect();
              return {
                headings:steps.map(e=>[e.querySelector('h2')?.textContent?.trim(),e.querySelector('p')?.textContent?.trim()]),
                nav:mainNav.map(e=>e.textContent?.trim()),
                firstStep:document.querySelector('.neir-source-step-content p')?.textContent?.trim(),
                boxes:{heroX:home?.x,heroY:home?.y,mediaX:media?.x,mediaY:media?.y,cardX:firstCard?.x,cardY:firstCard?.y},
                signedOutLoginVisible:Boolean(document.querySelector('.neir-auth-login'))
              };
            });
            console.log('Original desktop source parity:',JSON.stringify(sourceParity));
            if(sourceParity.headings.length!==2 ||
              sourceParity.headings[0][0]!=='Check Phone Registration Status by IMEI' ||
              sourceParity.headings[1][0]!=='Check Mobile Numbers Registered Under Your NID' ||
              sourceParity.headings.some(x=>x[1]!=='3 simple steps')) {
              throw Error('Guide headings must be meaningful and preserve both original service topics');
            }
            if(sourceParity.nav.length!==2) throw Error('Source top navigation must have Home and User Guides only');
            if(!sourceParity.firstStep?.startsWith('Dial *#06# on your phone')) throw Error('IMEI guide Step 1 must describe the illustrated dial-code action');
            if(!sourceParity.signedOutLoginVisible) throw Error('Signed-out Login control missing');
            await desktop.screenshot({path:'screenshots/neir-1918-source-match.png',fullPage:false});
            await desktop.locator('.neir-main-navigation button').nth(1).click();
            if(new URL(desktop.url()).pathname !== '/user-guides') throw Error('Guide path not preserved');
            await desktop.reload({waitUntil:'networkidle'});
            if(!(await desktop.getByRole('heading',{name:'User Guide of NEIR'}).isVisible())) throw Error('Guide refresh lost content');
            await desktop.getByRole('button',{name:'Password Reset',exact:true}).click();
            const resetAsset=desktop.locator('img[src$="pwd-guide-web-full-process.png"]');
            await resetAsset.scrollIntoViewIfNeeded();
            await resetAsset.evaluate(img=>img.decode());
            if(!(await resetAsset.evaluate(img=>img.naturalWidth>0))) throw Error('Original reset overview not loaded');
            await desktop.getByRole('tab',{name:'Mobile'}).click();
            if(await desktop.locator('article').count()!==5) throw Error('Mobile guide fallback lacks accessible steps');
            await desktop.getByRole('tab',{name:'Web'}).click();
            await desktop.screenshot({path:'screenshots/neir-guides-1918.png',fullPage:false});
            await desktop.locator('.neir-original-footer button').click();
            if(new URL(desktop.url()).pathname !== '/contact-us') throw Error('Contact path not preserved');
            await desktop.reload({waitUntil:'networkidle'});
            if(!(await desktop.getByRole('heading',{name:"We're here to help!"}).isVisible())) throw Error('Contact reload lost content');
            await desktop.screenshot({path:'screenshots/neir-contact-1918.png',fullPage:false});
            await desktop.goto('http://127.0.0.1:4567/', {waitUntil:'networkidle'});
            await desktop.evaluate(() => localStorage.setItem('neir-citizen-demo-session-v1', JSON.stringify({
              version:1,mobile:'01711223344',name:'Md. Zahid Hasan'
            })));
            await desktop.reload({waitUntil:'networkidle'});
            await desktop.getByRole('button',{name:'Citizen profile menu'}).click();
            await desktop.screenshot({path:'screenshots/neir-profile-menu-1918.png',fullPage:false});
          } finally {await browser.close()}
          EOT
      - name: Verify responsive foundation at seven device widths
        run: node scripts/neir-responsive-design-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: neir-source-restoration-screenshots
          path: screenshots/
          retention-days: 7
