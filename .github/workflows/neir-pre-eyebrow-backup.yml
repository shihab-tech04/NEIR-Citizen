name: Temporary NEIR pre-eyebrow-removal Git history backup
on:
  push:
    branches: ['fix/remove-special-registration-eyebrow-20261031']
    paths: ['.github/workflows/neir-pre-eyebrow-backup.yml']
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pre-release main, archive and test restoration
        run: |
          set -euo pipefail
          expected="8175e00edd27cf589975bee3b71bce1d57060b60"
          test "$(git rev-parse HEAD)" = "$expected"
          mkdir -p recovery
          git bundle create recovery/NEIR-pre-eyebrow-removal.bundle --all
          git bundle verify recovery/NEIR-pre-eyebrow-removal.bundle
          git clone -q recovery/NEIR-pre-eyebrow-removal.bundle /tmp/neir-restore
          test "$(git -C /tmp/neir-restore rev-parse HEAD)" = "$expected"
          git -C /tmp/neir-restore fsck --no-reflogs --no-progress
          sha256sum recovery/*.bundle > recovery/SHA256SUMS
          printf '%s\n' "pre_release_main=$expected" "restore_test=PASS" > recovery/RESTORE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neir-pre-eyebrow-backup
          path: recovery/
          if-no-files-found: error
          retention-days: 7
