name: Publish compiled NEIR Citizen frontend to GitHub Pages
on:
  push:
    branches: [main, 'fix/neir-pages-*']
    paths:
      - '.github/workflows/pages-prototype.yml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: neir-compiled-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript verification
        run: npm run lint
      - name: Build with GitHub Pages repository base path
        run: npm run build -- --base=/NEIR-Citizen/
      - name: Verify compiled application and source artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('dist')
          html=(root/'index.html').read_text()
          assert 'src="/NEIR-Citizen/assets/' in html, 'Pages JS base is incorrect'
          assert 'href="/NEIR-Citizen/assets/' in html, 'Pages CSS base is incorrect'
          for filename in (
              'neir-source/images/btrc-logo.png',
              'neir-source/images/govt-seal.svg',
              'neir-source/gifs/neir-herobanner.gif',
              'neir-source/user-guides/pwd-guide-web-steps/pwd-guide-web-full-process.png'
          ):
              assert (root/filename).is_file(), filename
          js=''.join(p.read_text() for p in (root/'assets').glob('*.js'))
          assert '/NEIR-Citizen/' in js and 'neir-source/' in js, 'Pages image base is incorrect'
          assert 'user-guides' in js and 'contact-us' in js, 'Subpage code missing'
          (root/'404.html').write_text(html)
          (root/'.nojekyll').touch()
          print('PASS: compiled base, image references and SPA fallback')
          PY
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy compiled frontend
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify public GitHub Pages output
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check public compiled index and original images
        shell: bash
        run: |
          set -euo pipefail
          url="https://shihab-tech04.github.io/NEIR-Citizen"
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 20 "$url/" -o /tmp/neir-live.html && grep -Fq '/NEIR-Citizen/assets/' /tmp/neir-live.html; then
              echo "PASS: compiled Vite assets are on public Pages"
              break
            fi
            if [[ "$attempt" -eq 15 ]]; then
              echo "FAIL: public Pages is not serving the compiled app"
              exit 1
            fi
            sleep 4
          done
          curl -fsSL --max-time 20 -o /tmp/btrc-logo.png "$url/neir-source/images/btrc-logo.png"
          curl -fsSL --max-time 20 -o /tmp/neir-reset-guide.png "$url/neir-source/user-guides/pwd-guide-web-steps/pwd-guide-web-full-process.png"
          test "$(wc -c </tmp/btrc-logo.png)" -gt 1000
          test "$(wc -c </tmp/neir-reset-guide.png)" -gt 1000
          echo "PASS: source BTRC logo and complete password reset guide publicly available"
