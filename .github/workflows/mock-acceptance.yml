name: NEIR public Special Registration journey acceptance
on:
  push:
    branches: [main, 'test/neir-frontend-mock-*']
    paths:
      - 'src/**'
      - 'scripts/neir-public-special-journeys.mjs'
      - 'scripts/neir-special-validation.test.mjs'
      - 'scripts/neir-profile-ui-contract.test.mjs'
      - 'scripts/neir-unified-ui-foundation.test.mjs'
      - 'scripts/neir-full-ui-system.test.mjs'
      - 'supabase/functions/neir-prototype-special/**'
      - '.github/workflows/mock-acceptance.yml'
      - 'public/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/neir-public-special-journeys.mjs'
      - 'scripts/neir-special-validation.test.mjs'
      - 'scripts/neir-profile-ui-contract.test.mjs'
      - 'scripts/neir-unified-ui-foundation.test.mjs'
      - 'scripts/neir-full-ui-system.test.mjs'
      - 'supabase/functions/neir-prototype-special/**'
      - '.github/workflows/mock-acceptance.yml'
      - 'public/**'
permissions:
  contents: read
jobs:
  public-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, typecheck and build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Check NEIR unified UI and profile/document contract
        run: |
          npm run ui:audit
          node scripts/neir-profile-ui-contract.test.mjs
          node scripts/neir-unified-ui-foundation.test.mjs
          node scripts/neir-full-ui-system.test.mjs
      - name: Check actual Edge handler mobile and date validators
        run: node scripts/neir-special-validation.test.mjs
      - name: Install Chromium for screenshot and journey tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 4567 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4567/ >/dev/null && break || sleep 1
          done
      - name: Verify no-login Special Registration journeys and capture screens
        run: node scripts/neir-public-special-journeys.mjs
      - name: Verify deployed Citizen/Admin Special Registration service
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url='https://wjsdylxbvdnraztktbtg.supabase.co/functions/v1/neir-prototype-special';
          const call=async(action,extra={})=>{
            const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({action,...extra})});
            return {status:response.status,payload:await response.json()};
          };
          const citizen=await call('citizen_list',{mobile:'01711223344'});
          assert.equal(citizen.status,200,'citizen reads shared SQL list');
          assert(Array.isArray(citizen.payload.items),'citizen list array');
          const admin=await call('admin_list');
          assert.equal(admin.status,200,'Admin reads the same SQL table');
          assert(Array.isArray(admin.payload.items),'Admin list array');
          const known=admin.payload.items.find(item=>item.id==='29954ad5-c7b0-40a4-9679-25fea5f7b6c8');
          if(known){
            const details=await call('admin_details',{id:known.id});
            assert.equal(details.status,200,'Admin details must mirror the citizen dossier');
            assert.equal(details.payload.record.documents.length,3,'three exact citizen uploads recovered');
            const types=details.payload.record.documents.map(d=>d.type).sort();
            assert.deepEqual(types,['commercialInvoice','courierBill','packingList'].sort());
            for(const doc of details.payload.record.documents){
              assert.equal(doc.available,true,'original uploaded file must exist');
              assert(typeof doc.filename==='string'&&doc.filename.length>1,'original filename retained');
              assert(/^https:\/\//.test(doc.uri),'private file has a short-lived view URL');
            }
          }
          const invalid=await call('citizen_list',{mobile:'wrong'});
          assert.equal(invalid.status,400,'citizen list requires a valid account mobile');
          const invalidSubmit=await call('submit',{imei:'23456789012345',reason:'airmail',
            arrivalDate:'2026-10-09',documents:['commercialInvoice']});
          assert.equal(invalidSubmit.status,400,'anonymous submission lacks citizen identifier');
          // Safe, non-persisting probes: each valid mobile/date reaches missing-document
          // validation before any file upload or SQL insert can occur.
          for (const [reason,documentType] of [
            ['airmail','courierBill'],
            ['gift','giftDeed'],
            ['foreign-tour','arrivalSeal']
          ]) {
            const probe=await call('submit',{
              mobile:'01711223344',imei:'23456789012345',
              reason,arrivalDate:'2026-10-09',files:[{type:documentType}]
            });
            assert.equal(probe.status,400,reason+' incomplete documents must not create an application');
            assert.equal(probe.payload.error,'Required uploaded documents are missing.',
              reason+' valid mobile/date must reach the document rules (regression: double-escaped regex)');
          }
          console.log('PASS: deployed mobile/date validation reaches document-specific rules for all acquisition methods');
          console.log('PASS deployed Citizen/Admin list transport and scoped submission contract');
          JS
      - name: Preserve screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neir-special-registration-acceptance-screenshots
          path: acceptance-shots/
          if-no-files-found: warn
          retention-days: 14
