name: NEIR frontend baseline checks
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Save offline presentation build
        uses: actions/upload-artifact@v4
        with:
          name: neir-citizen-presentation-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
