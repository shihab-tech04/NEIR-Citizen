name: NEIR FAQ 1:1 source comparison
on:
  push:
    branches: ['fix/neir-faq-source-*']
    paths: ['src/**','scripts/neir-faq-parity.mjs','.github/workflows/faq-parity.yml']
  pull_request:
    branches: [main]
    paths: ['src/components/FaqSection.tsx','src/index.css','scripts/neir-faq-parity.mjs','.github/workflows/faq-parity.yml']
permissions:
  contents: read
jobs:
  faq-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck and compile
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 4567 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4567/ >/dev/null && break || sleep 1; done
      - name: Compare original and clone at matching viewports
        run: node scripts/neir-faq-parity.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neir-faq-original-vs-clone
          path: faq-parity/
          retention-days: 14
