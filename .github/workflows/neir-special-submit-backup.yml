name: NEIR Special Registration submit pre-release full Git restore
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  full-git-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Independently restore full Git history and verify exact pre-release files
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="7643697b71d100b6f27f668c1cb617d45f2c951c"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$BEFORE"
          mkdir -p neir-recovery
          git bundle create neir-recovery/NEIR-Citizen-pre-submit-7643697b.bundle --all
          git bundle verify neir-recovery/NEIR-Citizen-pre-submit-7643697b.bundle
          git clone neir-recovery/NEIR-Citizen-pre-submit-7643697b.bundle /tmp/neir-restore
          git -C /tmp/neir-restore cat-file -e "$BEFORE^{commit}"
          for path in src/components/ProfileSpecialRegistrationModal.tsx src/components/ProfileSpecialRegistrationModal.css scripts/neir-mock-journeys.mjs src/utils/neirSpecialRegistrationApi.ts; do
            git show "$BEFORE:$path" > /tmp/original
            git -C /tmp/neir-restore show "$BEFORE:$path" > /tmp/restored
            cmp /tmp/original /tmp/restored
          done
          (cd neir-recovery && sha256sum NEIR-Citizen-pre-submit-7643697b.bundle > bundle.sha256)
          printf 'pre_release_commit=%s\\nrestore_test=PASS\\nsource_byte_comparison=PASS\\n' "$BEFORE" > neir-recovery/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEIR-Citizen-pre-submit-full-Git-restore-tested
          path: neir-recovery/
          retention-days: 7
