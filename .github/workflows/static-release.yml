name: Prepare NEIR static release branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neir-static-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Optimize large source guide image without cropping
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('dist/neir-source/user-guides/pwd-guide-web-steps/pwd-guide-web-full-process.png')
          dst=src.with_suffix('.webp')
          with Image.open(src) as img:
              img.save(dst, format='WEBP', quality=87, method=6)
          print(f'Original {src.stat().st_size} bytes, optimized {dst.stat().st_size} bytes')
          PY
      - name: Record raw SHA1 digests for standalone Vercel file delivery
        run: (cd dist && find . -type f -print0 | sort -z | xargs -0 sha1sum) > dist/SHA1SUMS
      - name: Split oversized NEIR source assets for verified transfer
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for source in Path('dist/neir-source/user-guides').rglob('*.png'):
              if source.stat().st_size <= 1000000:
                  continue
              data = base64.b64encode(source.read_bytes()).decode('ascii')
              target = Path('dist/__delivery_chunks__') / source.relative_to('dist')
              target.parent.mkdir(parents=True, exist_ok=True)
              for i, start in enumerate(range(0, len(data), 720000)):
                  Path(str(target) + f'.part{i:03d}.txt').write_text(data[start:start+720000])
              print(f'Chunked {source} into {(len(data)+719999)//720000} parts')
          PY
      - name: Publish compiled files to dedicated branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp -R dist /tmp/neir-compiled-static
          git clean -fdx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --heads origin presentation-static | grep -q 'refs/heads/presentation-static'; then
            git fetch origin presentation-static
            git checkout -B presentation-static origin/presentation-static
            git rm -r -f --ignore-unmatch .
          else
            git checkout --orphan presentation-static
            git rm -r -f --ignore-unmatch .
          fi
          git clean -fdx
          cp -R /tmp/neir-compiled-static/. .
          printf '%s\n' "$SOURCE_SHA" > SOURCE_COMMIT.txt
          touch .nojekyll
          git add -A
          git commit -m "build: NEIR frontend-only static presentation from $SOURCE_SHA"
          git push origin HEAD:refs/heads/presentation-static
