name: NEIR independent pre-release source history backup
on:
  push:
    branches: ['fix/neir-special-registration-custom-dropdown-mobile-20261101']
    paths: ['.github/workflows/neir-citizen-prerelease-backup.yml']
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create, checksum and restore test complete repository Git bundle
        shell: bash
        run: |
          set -euo pipefail
          original="e99255b10979ea39ac6778219e028d05d442019d"
          mkdir -p out
          git cat-file -e "$original^{commit}"
          git bundle create out/neir-citizen-before-dropdown-release.bundle --all
          (cd out && sha256sum neir-citizen-before-dropdown-release.bundle > SHA256SUMS)
          git bundle verify out/neir-citizen-before-dropdown-release.bundle
          git clone --quiet out/neir-citizen-before-dropdown-release.bundle /tmp/neir-citizen-restored
          git -C /tmp/neir-citizen-restored checkout --quiet "$original"
          test "$(git -C /tmp/neir-citizen-restored rev-parse HEAD)" = "$original"
          test -f /tmp/neir-citizen-restored/src/components/FigmaSpecialRegistrationModal.tsx
          test -f /tmp/neir-citizen-restored/src/components/FigmaSpecialRegistrationModal.css
          test -f /tmp/neir-citizen-restored/src/App.tsx
          (cd out && sha256sum --check SHA256SUMS)
          {
            echo "repository=shihab-tech04/NEIR-Citizen"
            echo "pre_release_main=$original"
            echo "restored_main=$(git -C /tmp/neir-citizen-restored rev-parse HEAD)"
            echo "bundle_integrity=PASS"
            echo "restore_test=PASS"
          } > out/RESTORE-RESULT.txt
          du -h out/neir-citizen-before-dropdown-release.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: neir-citizen-git-history-before-dropdown-mobile
          path: out/
          retention-days: 7
          if-no-files-found: error
